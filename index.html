:root{
  --blue:#0b4a8f;
  --blue2:#1976d2;
  --blue3:#3b97e8;
  --sky:#eaf5ff;
  --sky2:#f3f9ff;
  --ink:#17314d;
  --muted:#667a8f;
  --line:#dce7f1;
  --paper:#ffffff;
  --bg:#f5f8fb;
  --good:#1fa875;
  --good-soft:#ecfbf5;
  --yellow:#fff6d8;
  --shadow:0 18px 52px rgba(31,67,101,.10);
  --shadow-soft:0 10px 30px rgba(31,67,101,.08);
  --radius-xl:32px;
  --radius-lg:24px;
  --radius-md:18px;
  --max:1400px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 0%, rgba(214,236,255,.46), transparent 28%),
    radial-gradient(circle at 92% 9%, rgba(225,245,239,.38), transparent 24%),
    linear-gradient(180deg,#fbfdff 0,#f5f8fb 56%,#f8fafc 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
  letter-spacing:-.02em;
  font-size:16px;
}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid rgba(25,118,210,.22);outline-offset:3px}
button:disabled{opacity:.48;cursor:not-allowed}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0} h1,h2,h3,p{word-break:keep-all}
.screen{display:none;min-height:100vh;overflow:visible}.screen.active{display:block}
.shell{width:min(calc(100% - 56px),var(--max));margin:0 auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* splash */
.splash{
  position:fixed;inset:0;z-index:300;background:#fff;display:grid;place-items:center;
  transition:opacity .55s ease, visibility .55s ease;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;animation:splashEnter .65s cubic-bezier(.2,.8,.2,1) both}
.splash-logo{width:min(390px,72vw);height:auto;margin:0 auto}
.splash-line{width:58px;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--blue3));margin:28px auto 16px}
.splash-copy{font-weight:800;color:#688097;font-size:15px}
@keyframes splashEnter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* global header */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-bottom:1px solid rgba(220,231,241,.94)}
.topbar-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand-logo{width:218px;height:auto}
.utilities{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.utility{
  min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;
  color:#405a73;font-weight:850;font-size:13px;cursor:pointer;box-shadow:0 3px 10px rgba(35,72,107,.03)
}
.utility:hover{background:#f6fbff;border-color:#cddfeb}
.voice-switch{
  flex:none;min-height:36px;padding:0 11px;border:1px solid #cfe1f0;border-radius:999px;background:#f4f9fd;
  color:#2f6089;font-size:12px;font-weight:950;cursor:pointer;white-space:nowrap;transition:.18s ease;
}
.voice-switch[aria-pressed="true"]{background:#eaf5ff;border-color:#acd2ef;color:#0e67b7}
.voice-switch.speaking{box-shadow:0 0 0 5px rgba(39,133,214,.10)}
.voice-switch:hover{background:#eaf5ff}

body.copy-large .helper{font-size:21px}
body.copy-large .sensory p{font-size:17px}
body.copy-large .practice-label{font-size:16px}
body.copy-large .practice-result{font-size:16px}
body.copy-large .home-footnote{font-size:14px}
body.copy-large .complete-card p{font-size:21px}

.visual-stage.stage-enter{animation:stageEnter .38s ease-out both}
.instruction-card.page-enter{animation:copyEnter .42s .08s ease-out both}
@keyframes stageEnter{from{opacity:.72;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes copyEnter{from{opacity:.55;transform:translateY(7px)}to{opacity:1;transform:none}}

/* home */
.home-main{padding:68px 0 88px;overflow:hidden}
.hero{max-width:980px;margin:0 auto 50px;text-align:center}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid #d6e8f8;border-radius:999px;
  background:#eef7ff;color:var(--blue);font-weight:900;font-size:13px;opacity:0;transform:translateY(16px);
  animation:rise .55s .05s ease-out forwards;
}
.hero h1{
  margin-top:19px;font-size:clamp(46px,5vw,72px);line-height:1.12;letter-spacing:-.055em;font-weight:950;
  opacity:0;transform:translateY(28px);animation:rise .72s .16s cubic-bezier(.2,.76,.25,1) forwards;
}
.hero p{margin-top:18px;color:var(--muted);font-size:clamp(18px,1.7vw,23px);line-height:1.55;font-weight:720;opacity:0;transform:translateY(22px);animation:rise .62s .32s ease-out forwards}
.hero p strong{color:var(--blue);font-weight:950}
@keyframes rise{to{opacity:1;transform:none}}

.exam-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}
.exam-heading h2{font-size:25px;letter-spacing:-.04em}
.exam-heading p{color:#71869a;font-size:13px;font-weight:760}
.exam-heading-simple{justify-content:flex-start}
.exam-card{border:1px solid var(--line);border-radius:28px;background:#fff;
  box-shadow:var(--shadow-soft);text-align:left;cursor:pointer;opacity:0;transform:translateY(20px);animation:cardIn .55s ease-out forwards;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.exam-card:nth-child(1){animation-delay:.38s}.exam-card:nth-child(2){animation-delay:.44s}.exam-card:nth-child(3){animation-delay:.50s}.exam-card:nth-child(4){animation-delay:.56s}.exam-card:nth-child(5){animation-delay:.62s}
@keyframes cardIn{to{opacity:1;transform:none}}
.exam-card:hover{transform:translateY(-4px);box-shadow:0 23px 55px rgba(31,67,101,.13);border-color:#bfd8eb}
.exam-card.active-card{border:2px solid #65a9e3}
.exam-visual{background:linear-gradient(135deg,#edf7ff,#f2fbf7)}
.exam-visual::after{content:"";background:linear-gradient(180deg,transparent 54%,rgba(12,39,65,.18))}
.sample-chip{position:absolute;left:13px;top:13px;z-index:2;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid rgba(214,228,239,.96);font-weight:900;font-size:10px;color:#587187;backdrop-filter:blur(5px)}
.exam-icon-panel{place-items:center;}
.exam-icon-panel::before{content:"";filter:blur(2px)}.exam-icon-panel::after{content:"";filter:blur(2px)}
.exam-icon-panel::before{background:rgba(255,255,255,.64)}
.exam-icon-panel::after{background:rgba(255,255,255,.62)}
.tone-ultra{background:linear-gradient(135deg,#eaf4ff,#f6faff)}
.tone-ecg{background:linear-gradient(135deg,#eefaf7,#f5fbff)}
.tone-blood{background:linear-gradient(135deg,#fff5f3,#fffaf8)}
.tone-iv{background:linear-gradient(135deg,#f4f1ff,#f1f8ff)}
.exam-icon{z-index:1}
.exam-title-row h3{letter-spacing:-.04em;}
.card-arrow{border-radius:50%;place-items:center;background:#eef6fd;color:var(--blue2);font-weight:950;}
.active-card .card-arrow{background:var(--blue2);color:#fff}
.exam-body p{color:var(--muted);font-weight:650;}
.card-status{display:inline-flex;margin-top:13px;padding:7px 10px;border-radius:999px;background:#f1f4f7;color:#7b8d9d;font-size:11px;font-weight:900}
.active-card .card-status{background:#eaf4ff;color:var(--blue)}
.home-footnote{margin:24px auto 0;max-width:900px;text-align:center;color:#7e8fa0;font-size:12px;line-height:1.65}

/* story top */
#story > .topbar{display:none}
.story-bar{
  position:sticky;top:0;z-index:80;
  background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}
.story-bar-inner{min-height:72px;display:grid;grid-template-columns:minmax(260px,auto) auto minmax(360px,1fr);align-items:center;gap:18px}
.story-head-main{display:flex;align-items:center;gap:16px;min-width:0}
.story-title-mini{
  display:flex;align-items:center;gap:10px;
  font-weight:950;font-size:18px;white-space:nowrap;min-width:0;
  margin-right:auto;
}
.story-title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-actions{
  display:flex;align-items:center;gap:4px;flex:none;
  padding:4px;border:1px solid #e0eaf2;border-radius:16px;
  background:rgba(247,250,252,.92);
  box-shadow:0 6px 18px rgba(30,70,104,.05);
}
.home-label-mobile{display:none}
.story-icon{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#e4f2ff,#effaf6);display:grid;place-items:center;color:var(--blue);overflow:hidden}
.story-icon svg{width:34px;height:34px;display:block}
.progress-box{width:100%;justify-self:stretch}
.progress-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;color:#6a8094;font-size:13px;font-weight:850}
.progress-track{height:10px;border-radius:999px;background:#e8eff5;overflow:hidden}
.progress-fill{height:100%;width:10%;border-radius:999px;background:linear-gradient(90deg,var(--blue2),#53a8e9);transition:width .28s ease}
.home-btn{min-height:46px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#456078;font-weight:900;cursor:pointer}

.mascot-help-btn{display:inline-flex}
.mobile-action-btn{
  position:relative;
  width:42px;height:42px;min-height:42px;padding:0;
  display:grid;place-items:center;
  border:0;border-radius:12px;background:transparent;color:#31536f;
  font-weight:900;cursor:pointer;box-shadow:none;
  transition:background .16s ease,transform .16s ease,color .16s ease;
}
.mobile-action-btn:hover{background:#fff;transform:translateY(-1px)}
.mobile-action-btn:active{transform:translateY(0)}
.mobile-action-btn::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);
  transform:translateX(-50%) translateY(-2px);
  padding:6px 8px;border-radius:8px;background:#173c5d;color:#fff;
  font-size:10px;font-weight:800;white-space:nowrap;opacity:0;pointer-events:none;
  transition:.16s ease;z-index:100;
}
.mobile-action-btn:hover::after,
.mobile-action-btn:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0)}
.action-icon{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:#eef7ff;color:#2478c8;flex:none;
}
.action-icon svg{
  width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
.action-icon svg path:first-child{fill:currentColor;fill-opacity:.08}
.action-icon-help{background:#fff4cf;color:#c88708}
.mobile-mascot-thumb{
  width:32px;height:32px;border-radius:10px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,#fff9dc,#eef7ff);border:1px solid #e7ddae;flex:none;
}
.mobile-mascot-thumb img{
  width:43px;height:auto;display:block;transform:translateY(2px);
}
.mascot-help-action[aria-expanded="true"] .mobile-mascot-thumb{
  box-shadow:0 0 0 3px rgba(243,181,70,.18);
}
.action-label{white-space:nowrap}
.mobile-action-btn.is-off{color:#8494a2;background:#f7f9fb}
.mobile-action-btn.is-off .action-icon{background:#f0f3f6;color:#8494a2}

.story-main{padding:20px 0 42px}
#story .shell{width:min(calc(100% - 64px),1280px)}
.visual-stage{
  position:relative;width:100%;
  height:clamp(410px,calc(100dvh - 430px),520px);
  overflow:hidden;
  border:1px solid #d7e4ee;border-radius:28px;background:#e9f1f6;box-shadow:var(--shadow);
}
.visual-stage img{width:100%;height:100%;object-fit:cover}
.visual-stage.placeholder{display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#fff 0,#f2f8fc 42%,#e8f0f6 100%)}
.placeholder-inner{text-align:center;color:#6a8297;padding:32px}
.placeholder-inner svg{width:120px;height:120px;margin:0 auto 20px;color:#70a8d3}
.placeholder-inner strong{display:block;color:#355c7d;font-size:23px;letter-spacing:-.03em}

/* same-screen practice overlay */
.practice-overlay{

}
.practice-overlay.show{display:grid}
.practice-hud{text-align:center;color:#fff;animation:hudIn .25s ease-out}
.count-ring{
  position:relative;width:232px;height:232px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,251,242,.98);box-shadow:0 25px 70px rgba(0,0,0,.23);
}
.count-ring::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(#f3b546 var(--progress,0deg),rgba(255,255,255,.34) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 0)}
.count-number{font-size:88px;line-height:1;color:#c68014;font-weight:950;letter-spacing:-.05em}
.count-caption{margin-top:18px;font-size:26px;line-height:1.2;font-weight:950;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.count-sub{margin-top:8px;font-size:14px;font-weight:800;color:rgba(255,255,255,.9)}
.practice-hud.success .count-ring{background:#f5fffb;animation:successPop .44s cubic-bezier(.2,1.4,.3,1)}
.practice-hud.success .count-ring::before{background:conic-gradient(#5ac69f 360deg,#5ac69f 0)}
.practice-hud.success .count-number{font-size:72px;color:var(--good)}
.practice-hud.success .count-caption{font-size:26px}
.success-mascot{display:block;width:112px;max-width:40vw;height:auto;margin:12px auto 0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.12))}
@keyframes hudIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes successPop{0%{transform:scale(.86)}70%{transform:scale(1.07)}100%{transform:scale(1)}}

.instruction-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.instruction-card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-soft)}
.instruction-card{padding:24px 28px}
.step-kicker{color:var(--blue2);font-size:13px;font-weight:950;margin-bottom:8px}
.instruction-card h1{font-size:clamp(31px,3vw,46px);line-height:1.2;letter-spacing:-.05em;font-weight:950}
.helper{margin-top:10px;color:#5e7388;font-size:17px;line-height:1.52;font-weight:700;max-width:920px}
.practice-area{margin-top:24px;padding-top:22px;border-top:1px solid #e4edf4}
.practice-label{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:#455f77;font-weight:900;font-size:14px}
.primary-action{
  width:100%;min-height:62px;border:0;border-radius:18px;background:linear-gradient(135deg,#237fd5,#1266bd);color:#fff;font-weight:950;font-size:17px;cursor:pointer;box-shadow:0 12px 25px rgba(24,107,185,.18)
}
.primary-action:hover{filter:brightness(1.03)}
.practice-result{display:none;margin-top:13px;padding:14px 15px;border:1px solid #caeadf;border-radius:16px;background:var(--good-soft);color:#167956;font-weight:900;align-items:center;gap:10px}
.practice-result.show{display:flex;animation:resultIn .3s ease-out}
.practice-result .mini-check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;font-weight:950}
@keyframes resultIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@keyframes circlePop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

/* [연습 종류] 심호흡 */

#story .kind-ball{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cfe8ff,#5aa7e6);transform:scale(.55);transition:transform .6s ease}
#story .kind-breathe[data-phase=in] .kind-ball{transform:scale(1);transition-duration:var(--kind-in)}
#story .kind-breathe[data-phase=out] .kind-ball{transform:scale(.45);transition-duration:var(--kind-out)}
#story .kind-breathe[data-phase=done] .kind-ball{background:radial-gradient(circle at 35% 30%,#d4f3e3,#3fb27f);transform:scale(.7)}
#story .kind-word{position:relative;font-size:20px;font-weight:700;color:#0f3b62}
#story .kind-dots{display:flex;gap:10px}
#story .kind-dot{width:14px;height:14px;border-radius:50%;background:#d9e3ec}

/* [연습 종류] 순서 고르기: 위 = 순서 칸, 아래 = 섞인 카드. 다음에 넣을 칸·카드는 노란 테두리 */
#story .kind-slots{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px}
#story .kind-slot{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:2px dashed #c9d6e2;border-radius:12px;background:#f7fafc}

#story .kind-slot[data-next=true]{border:3px solid #f2c94c;background:#fffbea}
#story .kind-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e3ebf3;color:#41607d;font-weight:700;flex-shrink:0}

/* 끌고 있는 카드는 제자리에 흐리게 남고, 손가락을 따라오는 카드(body 에 붙임)가 위에 */
#story .kind-seq-card[data-lifted=true]{opacity:.35}

#story .kind-figure{width:min(100%,240px)}

#story .instruction-card .ux-replay{position:absolute!important;top:14px;right:14px;display:inline-flex!important;align-items:center;gap:5px;margin:0!important;min-height:34px;padding:4px 12px!important;border-radius:99px!important;font-size:13px!important;font-weight:700!important;z-index:2}
#story .instruction-card:has(.ux-replay) .step-kicker{margin-right:104px}
#story .instruction-card:has(.ux-replay)>h1:first-of-type,#story .instruction-card:has(.ux-replay) #storyTitle{padding-right:0}
#story .instruction-card .ux-replay svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){#story .practice-execution .ux-bar i{transition:none}body.ux-wait #story .practice-execution .ux-bar b,#story .practice-layout.ux-celebrate .ux-donebox *,#story .practice-execution .ux-bar b.ux-tick{animation:none!important}}

/* v1.9 · T2-b step confirmation toast */
.v14-moment{left:50%!important;right:auto!important;width:auto!important;max-width:calc(100% - 32px)!important;min-width:0!important;background:#fff!important;color:#0f7b4f!important;border:1.5px solid #bfe6d4!important;border-radius:999px!important;box-shadow:0 10px 26px -10px rgba(11,42,74,.38)!important;padding:8px 18px 8px 9px!important;gap:10px!important;font-size:16px!important;font-weight:900!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;white-space:nowrap;animation:uxToastC 1.45s ease both!important;transform:translateX(-50%)}
.v14-moment .v14-moment-mark{width:34px!important;height:34px!important}
.v14-moment small{display:inline!important;font-size:13px!important;font-weight:600!important;color:#4c6378!important;margin:0 0 0 8px!important}
@keyframes uxToastC{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
@media (prefers-reduced-motion:reduce){.v14-moment{animation:none!important;opacity:1}}

/* v2.0 · AI voice notice */
.ux-ai-note{margin:6px auto 4px;max-width:640px;text-align:center;font-size:13px;line-height:1.6;color:#5f7389}

/* v2.3 · D5 completion entrance (restored from the v1.0 design) */
@keyframes completion-arrive{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes v10-stamp-in{0%{opacity:0;transform:scale(1.2) rotate(-8deg)}65%{opacity:1;transform:scale(.96) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
@keyframes v10-check-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
#complete.v10-first-complete .v09-complete-character{animation:completion-arrive .45s ease-out both}
#complete.v10-first-complete .complete-copy{animation:completion-arrive .35s .15s both}
#complete.v10-first-complete .v10-completion-stamp{animation:v10-stamp-in .5s ease-out both}
@media (prefers-reduced-motion:reduce){#complete .v09-complete-character,#complete .complete-copy,#complete .v10-completion-stamp{animation:none!important}}
/* v2.3 · D6 way back to the completion review */
#story .ux-review-back{display:block;width:100%;margin:0 0 10px;padding:13px 16px;border:1.5px solid #bfe6d4;border-radius:14px;background:#f1fbf6;color:#0f7b4f;font:inherit;font-size:16px;font-weight:800;cursor:pointer}

/* v2.6 · G2 미리 알아두어요: reading on/off before the title, the attached sound as a bar */
#pSheet .nurse-panel-head.ux-gh{grid-template-columns:44px minmax(0,1fr) 44px;gap:8px 12px}
#pSheet .ux-gh #help-title{grid-column:2;grid-row:1}
#pSheet .ux-gh .nurse-close{grid-column:3;grid-row:1}
#pSheet .ux-gh .ux-gvoice,#pSheet .ux-gh .v10-help-icon{grid-column:1;grid-row:1;justify-self:center}
#pSheet .ux-gvoice{display:grid;place-items:center;width:44px;height:44px;margin:0;padding:0;border:1.5px solid #c9dcee;border-radius:12px;background:#eef5fc;color:#1767a6;cursor:pointer}
#pSheet .ux-gvoice svg{width:24px;height:24px}
#pSheet .ux-gvoice .ux-gv-on{display:none}
#pSheet .ux-gvoice[aria-pressed=true]{border-color:#7fcca6;background:#e3f5ec;color:#0f7b4f;box-shadow:0 0 0 4px #cdeedd}
#pSheet .ux-gvoice[aria-pressed=true] .ux-gv-on{display:block}#pSheet .ux-gvoice[aria-pressed=true] .ux-gv-off{display:none}
.nurse-panel .ux-gsound{flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px 12px;margin:0 20px 20px;padding:10px 14px 12px 10px;border:1px solid #d6e6f4;border-radius:14px;background:#f4f9ff}
.nurse-panel .nurse-panel-head+.ux-gsound{margin-top:20px}
.ux-gsound-btn{grid-row:1 / 3;display:grid;place-items:center;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:50%;background:#1767a6;color:#fff;cursor:pointer}
.ux-gsound-btn svg{width:18px;height:18px}
.ux-gsound-name{min-width:0;font-size:15px;line-height:1.3;color:#14365a}
.ux-gsound-time{justify-self:end;font-size:13px;color:#5f7389;font-variant-numeric:tabular-nums;white-space:nowrap}
.ux-gsound-track{grid-column:2 / 4;height:6px;overflow:hidden;border-radius:99px;background:#dbe7f2}
.ux-gsound-track i{display:block;width:0;height:100%;background:#1f9d64;transition:width .25s linear}
.ux-gsound[data-state=play]{border-color:#bfe6d4;background:#f1fbf6}
.ux-gsound[data-state=play] .ux-gsound-btn{background:#0f7b4f}
.ux-gsound[data-state=play] .ux-gsound-name{color:#0f5a3a}
.ux-gsound[data-state=play] .ux-gsound-track{background:#dbeee4}
.ux-gsound audio{display:none}
body.copy-large .ux-gsound-name{font-size:19px}body.copy-large .ux-gsound-time{font-size:16px}
@media(max-width:760px){.nurse-panel .ux-gsound{margin:0 16px 16px}.nurse-panel .nurse-panel-head+.ux-gsound{margin-top:16px}}
/* v2.6 · G3 one plain × for every close button */
html body .p-overlay :is(.p-close,.nurse-close){display:grid!important;place-items:center;width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;box-shadow:none!important;color:#5a7189!important;font-size:0!important;line-height:0!important}
html body .p-overlay :is(.p-close,.nurse-close) svg{width:22px;height:22px;stroke-width:2}
html body .p-overlay :is(.p-close,.nurse-close):hover{background:#eef3f8!important}
/* v2.6 · B-1 나의 검사 일정: the date fields under the picture across the full width on every screen */
html body #story .schedule-card .schedule-illustration{grid-row:1!important;align-self:center!important}
html body #story .schedule-card .schedule-heading{grid-column:2!important;grid-row:1!important;align-self:center!important}
html body #story .schedule-card .schedule-input{grid-column:1 / -1!important;grid-row:2!important}

/* internal build 2.8 · C1 numbered review list, C2 checks pop in */
#complete .ux-jnum{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:#e4eef9;color:#1f4f80;font-size:17px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
body.copy-large #complete .ux-jnum{width:46px;height:46px;font-size:20px}
#complete .v15-journey-stamp{width:34px!important;height:34px!important}
/* the older check-in animations (v1.0 and v2.3) are replaced by the pop below */
html body #complete .v15-journey .stamped .v15-journey-stamp{animation:none}
#complete .v15-journey.ux-arm .stamped .v15-journey-stamp{opacity:0;transform:scale(.3)}
html body #complete .v15-journey.ux-pop .stamped .v15-journey-stamp{border-radius:50%;animation:ux-check-pop .5s cubic-bezier(.2,.9,.3,1.2) var(--ux-pop,0ms) both,ux-check-ring .7s ease-out calc(var(--ux-pop,0ms) + .22s) both}
@keyframes ux-check-pop{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.28)}78%{transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes ux-check-ring{0%{box-shadow:0 0 0 0 rgba(31,157,100,.45)}100%{box-shadow:0 0 0 12px rgba(31,157,100,0)}}
@media(prefers-reduced-motion:reduce){#complete .v15-journey.ux-arm .stamped .v15-journey-stamp{opacity:1;transform:none}html body #complete .v15-journey.ux-pop .stamped .v15-journey-stamp{animation:none}}

/* 버튼 자리 고정: 화면 높이를 다 쓰는 세로 줄 → [이전]·[다음] 줄은 맨 아래 (내용이 길면 원래대로 아래에 붙어 따라옴) */
#story.screen.active{display:flex!important;flex-direction:column}
#story>.story-main{flex:1 0 auto;display:flex!important;flex-direction:column}
#story>.story-main>.shell{flex:1 0 auto;display:flex!important;flex-direction:column}
html body #story .story-main>.shell>.story-nav,html body #story .practice-layout>.story-nav{margin-top:auto!important}
html body #story .story-nav .nav-btn{min-height:64px!important;height:64px!important;font-size:18px!important}
#complete.screen.active{display:flex!important;flex-direction:column}
#complete>.complete-main{flex:1 0 auto;display:flex!important;flex-direction:column}
html body #complete .complete-actions{margin-top:auto!important}
html body #complete .complete-actions button{min-height:64px!important;font-size:17px!important}
/* 11-12: 폰(600px 아래)은 두 버튼을 나란히 둘 너비가 모자라 「↻ 이 검사 다시 연습하기」가 두 줄로 접힘 → 한 줄에 하나씩 위아래로, 높이는 조금 낮게 (PC 는 그대로 나란히) */
@media(max-width:600px){html body #complete .complete-actions{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}html body #complete .complete-actions button{min-height:56px!important;white-space:nowrap!important}}
/* 11-12: 가장 좁은 폰(320)은 스티커 칸이 좁아 「하트 스티커」가 두 줄 → 글자만 조금 작게 한 줄 */
@media(max-width:350px){html body #complete .our-pick{font-size:14px!important;padding-left:2px!important;padding-right:2px!important;white-space:nowrap}}
/* PC 넓은 화면(1024px~): 연습 단계도 보통 단계와 같은 폭 → 위 아이콘·[이전]·[다음]이 옆으로 움직이지 않게 */
@media(min-width:1024px){html body #story:has(.practice-layout) .story-bar-inner,html body #story .story-main>.shell.practice-layout{width:min(calc(100% - 64px),var(--ux-col,880px))!important}}
/* 위 아이콘: 모든 단계 같은 크기 */
html body #story.screen .story-actions .mobile-action-btn.v14-tool{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important}
/* 우리 연습 종류: 버튼 줄은 연습 칸 맨 아래 한 자리 (제목 줄 수·그림 크기가 달라도), 버튼이 없을 때도 자리는 그대로 */
html body #story .kind-layout>.kind-card{flex:1 0 auto}
html body #story .kind-card>.kind-actions{margin-top:auto;min-height:64px}
html body #story .kind-layout[data-photo] .kind-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;column-gap:14px}
html body #story .kind-layout[data-photo] .kind-card>*{grid-column:1/-1}
html body #story .kind-layout[data-photo] .kind-card>.kind-photo{grid-column:1;grid-row:1;margin:0;border-radius:14px;overflow:hidden;background:#eef3f8}
html body #story .kind-photo img{display:block;width:100%;height:auto;max-height:42vh;max-height:42dvh;object-fit:contain}
html body #story .kind-layout[data-photo] .kind-card>.kind-figure{grid-column:2;grid-row:1;justify-self:center;width:min(100%,240px)}
html body #story .kind-zone.kind-hint .kind-zone-hit{fill-opacity:.35;stroke:#ffb703;stroke-width:3}
/* 사진 없는 부위 고르기: 그림 높이(폭 × 1.5)를 화면 높이에 맞춤 — 폰에서 그림·느낌 상자·[다시 해 보기]가 잘리지 않게 */
html body #story .kind-layout[data-kind=tapArea]:not([data-photo]) .kind-figure{width:min(100%,clamp(150px,calc((100vh - 560px) / 1.5),240px));width:min(100%,clamp(150px,calc((100dvh - 560px) / 1.5),240px))}
html body #story .kind-breathhold[data-phase=ready] .kind-ball{transform:scale(.55)}
html body #story .kind-breathhold[data-phase=hold] .kind-ball{transform:scale(1);background:radial-gradient(circle at 35% 30%,#bcd6ff,#2f6fd6);transition-duration:.2s}
html body #story .kind-breathhold[data-phase=hold] .kind-word{font-size:56px;font-weight:800;color:#fff}
html body #story .kind-bh-steps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0;padding:0;list-style:none}
html body #story .kind-bh-steps li{padding:6px 12px;border-radius:999px;background:#eef3f8;color:#5b6b7d;font-size:15px;font-weight:700}
html body #story .kind-bh-steps li.now{background:#0b4a8f;color:#fff}
html body #story .kind-bh-steps li.now::before{content:'▶ '}
html body #story .kind-bh-steps li.done{background:#dff3e8;color:#1e6b45}
html body #story .kind-bh-steps li.done::before{content:'✓ '}
html body #story .kind-actions>button{min-height:64px!important;font-size:18px!important}
/* 글자 */
html body #story .instruction-card .helper{font-size:20px!important}
html body.copy-large #story .instruction-card .helper{font-size:24px!important}
@media(max-width:600px){html body #story .instruction-card h1{font-size:26px!important}}
html body #story .ux-phase-top span{font-size:15px!important}
html body #story .ux-seg2 em{font-size:13px!important}
html body #story .step-kicker{font-size:15px!important}
html body #home .exam-card .exam-body>p{font-size:16px!important}
html body #home .hero>p{font-size:17px!important}
html body #home .ux-ai-note{font-size:14px!important}
html body .topbar .utility{font-size:14px!important}
html body .v15-journey-label small,html body .v15-journey-title>span{font-size:14px!important}

/* 낮은 넓은 화면(1280×720 · 1024×768): 일정 단계에서 [날짜 선택]을 펼치면 연도·월·일 칸이 [이전]·[다음] 줄에 가렸음 (11-11 전부터)

body{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
#story h1,#story h2,#story h3,#home h1,#home h2,#home h3,#complete h1,#complete h2,#complete h3,.our-layer h2,.our-layer h3,#pSheet h2,#pSheet h3,#story .step-kicker,#story button,#home button,#complete button,.our-layer button,#pSheet button,#story .our-xr-cap,#story .our-gal-desc,#story .kind-feel,#story .practice-result{text-wrap:balance}
#story p,#story li,#home p,#complete p,.our-layer p,#pSheet p,#pSheet li,#story figcaption{text-wrap:pretty}
#story .helper,#story .instruction-card>p,#home .exam-card p,#complete .complete-hero p{text-wrap:balance}
.our-nb{white-space:nowrap}
#storyTitle .our-sent{display:inline-block}
/* 11-12 본인 "터치 반응 버그·호환 다 생각해서": 아이가 버튼을 빨리 두 번 누르면 아이폰은 화면을 두 번 톡 확대로 받아 커질 수 있음 → 누르는 것만 막음
   (두 손가락 확대는 그대로). :where 로 세기 0 이라 끌기 칸 등에 이미 있는 touch-action:none 이 이김 */
:where(button,[role=button],a[href],summary,label,select,[data-kind-part],[data-our-long]){touch-action:manipulation}
#story .story-bar-inner.our-title-wrap{grid-template-columns:minmax(0,1fr)!important;row-gap:6px}
#story .story-bar-inner.our-title-wrap>.story-title-mini{grid-column:1/-1!important;grid-row:1!important;max-width:none!important;width:auto!important;margin-top:10px}
#story .story-bar-inner.our-title-wrap>.story-title-mini>.story-title-text{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;text-wrap:balance}
#story .story-bar-inner.our-title-wrap>.story-actions{grid-column:1/-1!important;grid-row:2!important;justify-self:end}
#story .story-bar-inner.our-title-wrap>.progress-box{grid-column:1/-1!important;grid-row:3!important}

@media (min-width:1024px) and (orientation:landscape) and (min-height:600px){
#story .our-wait-row{display:flex;flex-wrap:wrap}
#story .our-wait-row>.our-wait{flex:1 1 auto;white-space:nowrap}
/* 11단계 「미리 알아두어요」를 펴면 글 칸이 길어져 화면이 내려가며 왼쪽 그림 위가 위 막대 밑으로 잘렸음 → 왼쪽 사진 칸은 위 막대 아래에 붙어 있음 */
html body #story.screen .story-main>.shell>.visual-wrap{position:sticky;top:170px}
/* 11-12 본인 "왼쪽 오른쪽 화면이 안 맞아": 사진 칸이 4:3(영상 16:9)으로 묶여 오른쪽 글 칸·버튼 줄보다 짧았음 (1280×720 135px · 1728×1270 393px, 영상은 가운데 떠 있음)
   → 연습 단계 왼쪽 칸처럼 버튼 줄 끝 16px 위까지 늘림. 사진·그림·영상은 그 안 가운데 (사진은 다 보이게, 남는 곳은 원래 있던 흐린 배경).
     글 칸이 길어져 화면이 내려가도 왼쪽은 화면 높이까지만 (위의 붙어 있기 그대로) */
html body #story.screen .story-main>.shell>.visual-wrap,html body #story.screen .story-main>.shell>.visual-wrap:has(video){align-self:stretch;margin:0 0 16px!important;display:flex;flex-direction:column;max-height:calc(100vh - 186px)}
html body #story.screen .story-main>.shell>.visual-wrap>.visual-stage{flex:1 1 auto;aspect-ratio:auto!important;max-height:none!important}
html body #story.screen .story-main>.shell>.visual-wrap>.visual-stage>.ux-frame{margin:auto 0;max-height:100%}
/*   「다 보이게」 사진(세로 사진 등)은 틀을 칸 전체로 → 높은 화면에서 더 크게. 「꽉 채우기」·영상·위치를 맞춘 사진(확대·이동, our-framed)은 틀 비율 그대로 가운데 */
/* 11-12 끝 화면 PC 두 칸: 한 줄이라 1280×720 에서 미션 3 이 아래 버튼 줄에 가리고 칭찬 스티커·연습만 다시 하기는 굴려야 보였음
   → 왼쪽 「잘했어요」 + 연습만 다시 하기, 오른쪽 미션 + 칭찬 스티커, 아래 넓게 전체 검사 순서 (1024×768 ~ 1728×1270 굴리지 않고 다 보임) */
html body #complete .complete-main:has(>.our-mission-done){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"hero board" "room board" "journey journey";column-gap:24px;row-gap:16px;align-items:start;width:min(100% - 64px,1240px)!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important}
html body #complete .complete-main:has(>.our-mission-done)>.complete-hero{grid-area:hero;margin:0!important;width:auto!important;max-width:none!important}
html body #complete .complete-main:has(>.our-mission-done)>.our-mission-done{grid-area:board;margin:0!important;width:auto!important;max-width:none!important}
html body #complete .complete-main:has(>.our-mission-done)>.our-room{grid-area:room;margin:0!important;width:auto!important;max-width:none!important}
html body #complete .complete-main:has(>.our-mission-done)>.v15-journey-section{grid-area:journey;margin:8px 0 0!important;width:auto!important;max-width:none!important}
/* 11-13 본인 "미션 완료 창 위치가 좀 어색": 오른쪽 미션 칸이 왼쪽(잘했어요 + 연습만 다시)보다 짧게 위에 떠 있고(1280×800 에서 58px), 「잘했어요」는 카드 없이
   옅은 얼룩 배경이라 다른 칸과 따로 놀고, 아래 [이 검사 다시 연습하기] · [다른 검사 살펴보기] 줄이 왼쪽 칸 밑에 치우쳐 있었음 (뒤 흐린 띠도 화면 왼쪽으로 치우침)
   → 「잘했어요」도 흰 카드, 미션 칸은 왼쪽 두 칸 높이만큼 (위는 같은 줄에서 시작 · 아래 끝도 같음, 칭찬 스티커는 칸 아래쪽으로), 버튼 줄은 두 칸 전체 폭 가운데 */
html body #complete .complete-main:has(>.our-mission-done)>.complete-hero{background:radial-gradient(520px 260px at 50% 30%,rgba(25,118,210,.08),rgba(25,118,210,0) 70%),#fff!important;border-radius:20px;box-shadow:0 8px 24px -16px rgba(11,42,74,.35);padding:18px 16px!important;box-sizing:border-box}
html body #complete .complete-main:has(>.our-mission-done)>.our-mission-done{align-self:stretch;display:flex;flex-direction:column;box-sizing:border-box}
html body #complete .complete-main:has(>.our-mission-done)>.our-mission-done>h3{margin-top:auto!important;padding-top:16px}
/* 11-13 본인 "스티커 칸 아래 끝도 맞춰 줘": 스티커 아래에 「○○ 스티커를 골랐어요.」 자리(37px)를 비워 둬서 스티커 칸 아래 끝이 왼쪽 연습 칸 아래 끝보다 37px 위였음
   → PC 두 칸에선 그 글을 제목 「칭찬 스티커를 하나 골라요」 바로 아래로 (비었을 땐 자리 없음, 고르면 위의 빈 곳이 줄어 스티커 칸은 안 움직임),
   왼쪽 연습 칸도 칸 높이를 끝까지 쓰고 버튼 줄을 아래에 붙임 → 두 카드 아래 끝 · 버튼 아래 끝이 같은 줄 */
html body #complete .complete-main:has(>.our-mission-done)>.our-mission-done>.our-pick-said{order:1;min-height:0;margin:0 0 8px}
html body #complete .complete-main:has(>.our-mission-done)>.our-mission-done>.our-pick-said:empty{margin:0}

,"style":"F1@1+t","exams":["reference_xray"]},{"hash":"14p2yv7_20","text":"내 이름을 부르면 검사실로 들어가요.","audio":"tts_14p2yv7_20","style":"F1@1+t","exams":["reference_xray"]},{"hash":"101ms2s_33","text":"검사 기계 앞에 서요.\n발판이 필요하면 선생님이 알려 줘요.","audio":"tts_101ms2s_33","style":"F1@1+t","exams":["reference_xray"]},{"hash":"1pzwcg4_20","text":"판이 조금 차갑게 느껴질 수 있어요.","audio":"tts_1pzwcg4_20","style":"F1@1+t","exams":["reference_xray"]},{"hash":"15okwfo_22","text":"촬영할 때 기계 소리가 들릴 수 있어요.","audio":"tts_15okwfo_22","style":"F1@1+t","exams":["reference_xray"]},{"hash":"6l7j4x_19","text":"잠깐 숨을 참는 연습을 해 볼까요?","audio":"tts_6l7j4x_19","style":"F1@1+tq","exams":["reference_xray"]},{"hash":"1tuvw8v_20","text":"3초 동안 숨을 참고 가만히 있어요.","audio":"tts_1tuvw8v_20","style":"F1@1+t","exams":["reference_xray","reference_ultrasound"]},{"hash":"1gg7pwk_5","text":"잘했어요!","audio":"tts_1gg7pwk_5","style":"F1@1+t","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"1d9b7h2_22","text":"잘했어요! 검사 과정을 끝까지 살펴봤어요","audio":"tts_1d9b7h2_22","style":"F1@1+t","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"18cxu60_24","text":"이어서 볼까요? 지난번에 2단계까지 봤어요.","audio":"tts_18cxu60_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"11x0ih1_24","text":"이어서 볼까요? 지난번에 3단계까지 봤어요.","audio":"tts_11x0ih1_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"15k7e92_24","text":"이어서 볼까요? 지난번에 4단계까지 봤어요.","audio":"tts_15k7e92_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"wvnz9v_24","text":"이어서 볼까요? 지난번에 5단계까지 봤어요.","audio":"tts_wvnz9v_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"dwlal0_24","text":"이어서 볼까요? 지난번에 6단계까지 봤어요.","audio":"tts_dwlal0_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"webn8h_24","text":"이어서 볼까요? 지난번에 7단계까지 봤어요.","audio":"tts_webn8h_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"1y1swg2_24","text":"이어서 볼까요? 지난번에 8단계까지 봤어요.","audio":"tts_1y1swg2_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"ij035b_24","text":"이어서 볼까요? 지난번에 9단계까지 봤어요.","audio":"tts_ij035b_24","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"159h659_25","text":"이어서 볼까요? 지난번에 10단계까지 봤어요.","audio":"tts_159h659_25","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"1qyexg0_25","text":"이어서 볼까요? 지난번에 11단계까지 봤어요.","audio":"tts_1qyexg0_25","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_blood","reference_iv"]},{"hash":"13z26j3_25","text":"이어서 볼까요? 지난번에 12단계까지 봤어요.","audio":"tts_13z26j3_25","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_blood","reference_iv"]},{"hash":"1avqx9e_25","text":"이어서 볼까요? 지난번에 13단계까지 봤어요.","audio":"tts_1avqx9e_25","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_blood","reference_iv"]},{"hash":"1chuchl_25","text":"이어서 볼까요? 지난번에 14단계까지 봤어요.","audio":"tts_1chuchl_25","style":"F1@1+tq","exams":["reference_xray","reference_ultrasound","reference_blood","reference_iv"]},{"hash":"1it4cqa_55","text":"검사 전에 음식을 먹지 말라고 할 수 있어요.\n그럴 때는 병원에서 알려 준 시간 동안 먹지 않아요.","audio":"tts_1it4cqa_55","style":"F1@1+t","exams":["reference_ultrasound"]},{"hash":"8g8h7k_35","text":"복부 초음파 검사실로 가요.\n내 차례가 되면 검사실로 들어가요.","audio":"tts_8g8h7k_35","style":"F1@1+t","exams":["reference_ultrasound"]},{"hash":" o":"tts_17bxx62_19","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"13trhsh_47","text":"작은 전극이 가슴과 팔, 다리에 붙을 수 있어요. 피부에 닿는 느낌이 들 수 있어요.","audio":"tts_13trhsh_47","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"14lebi5_26","text":"팔과 다리에 힘을 빼요.\n편안하게 누워 있어요.","audio":"tts_14lebi5_26","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"9pvv9t_28","text":"선생님이 전극을 붙이는 동안 편안하게 누워 있어요.","audio":"tts_9pvv9t_28","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"1bbffg5_21","text":"몸에 힘을 빼고 편안하게 누워 있어요.","audio":"tts_1bbffg5_21","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"1bbw6w2_38","text":"검사가 끝나면 선생님이 전극을 떼어 줘요.\n모두 뗄 때까지 기다려요.","audio":"tts_1bbw6w2_38","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"u9hqez_30","text":"옷을 다시 정리해요.\n보호자와 함께 검사실에서 나가요.","audio":"tts_u9hqez_30","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"55rnlq_27","text":"전극을 붙인 자리에 잠시 자국이 남을 수 있어요.","audio":"tts_55rnlq_27","style":"F1@1+t","exams":["reference_ecg"]},{"hash":"17fkhox_32","text":"채혈실로 가요.\n내 이름이나 번호를 부를 때까지 기다려요.","audio":"tts_17fkhox_32","style":"F1@1+t","exams":["reference_blood"]},{"hash":"3ddeoi_41","text":"소매를 걷어 팔이 보이도록 해요.\n어려우면 선생님에게 도와 달라고 말해요.","audio":"tts_3ddeoi_41","style":"F1@1+t","exams":["reference_blood"]},{"hash":"1re5bt3_26","text":"채혈 의자에 앉아요.\n팔을 받침대 위에 올려요.","audio":"tts_1re5bt3_26","style":"F1@1+t","exams":["reference_blood"]},{"hash":"20hzr_46","text":"채혈할 때는 팔을 움직이지 않는 게 중요해요.\n팔을 편안하게 놓는 모습을 살펴봐요.","audio":"tts_20hzr_46","style":"F1@1+t","exams":["reference_blood"]},{"hash":"pr75gj_20","text":"팔을 가만히 두는 연습을 해 볼까요?","audio":"tts_pr75gj_20","style":"F1@1+tq","exams":["reference_blood"]},{"hash":"i6mtp_25","text":"팔을 편안하게 펴고 3초 동안 가만히 있어요.","audio":"tts_i6mtp_25","style":"F1@1+t","exams":["reference_blood"]},{"hash":"pyv11m_18","text":"검사 선생님이 팔에 띠를 감아요.","audio":"tts_pyv11m_18","style":"F1@1+t","exams":["reference_blood","reference_iv"]},{"hash":"o5sosa_24","text":"팔이 조금 꽉 조이는 느낌이 들 수 있어요.","audio":"tts_o5sosa_24","style":"F1@1+t" za2kj_69","style":"F1@1+t","exams":["reference_blood"]},{"hash":"16qxf3c_56","text":"위내시경용 정맥주사는 손이나 팔에 가는 관을 넣는 거예요.\n바늘이 들어갈 때 조금 따끔할 수 있어요.","audio":"tts_16qxf3c_56","style":"F1@1+t","exams":["reference_iv"]},{"hash":"j64y82_48","text":"필요하면 주사관으로 약을 넣어요.\n약이 들어가면 졸릴 수 있으니 편안하게 누워 있어요.","audio":"tts_j64y82_48","style":"F1@1+t","exams":["reference_iv"]},{"hash":"15i7tlk_20","text":"피를 뽑는 동안 볼 것을 골라 봐요.","audio":"tts_15i7tlk_20","style":"F1@1+t","exams":["reference_blood"]},{"hash":"j46ahz_17","text":"다른 곳을 보며 잘 기다렸어요!","audio":"tts_j46ahz_17","style":"F1@1+t","exams":["reference_blood"]},{"hash":"1lav2dz_48","text":"바늘을 뺀 자리를 솜이나 거즈로 꾹 눌러요.\n문지르지 말고 알려 준 시간 동안 눌러요.","audio":"tts_1lav2dz_48","style":"F1@1+t","exams":["reference_blood"]},{"hash":"d4rmj6_7","text":"볼 곳 고르기","audio":"tts_d4rmj6_7","style":"F1@1+t","exams":["reference_blood"]},{"hash":"tvm0fv_12","text":"별 스티커를 골랐어요.","audio":"tts_tvm0fv_12","style":"F1@1+t","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"5rymud_13","text":"하트 스티커를 골랐어요.","audio":"tts_5rymud_13","style":"F1@1+t","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"1fjw2pk_12","text":"꽃 스티커를 골랐어요.","audio":"tts_1fjw2pk_12","style":"F1@1+t","exams":["reference_xray","reference_ultrasound","reference_ecg","reference_blood","reference_iv"]},{"hash":"1p01isb_8","text":"보호자와 보기.","audio":"tts_1p01isb_8","style":"F1@1+t","exams":["reference_xray","reference_blood","reference_iv"]},{"hash":"g4d3jx_28","text":"의자에 앉아 조용히 기다려요. 천천히 숨을 쉬어요.","audio":"tts_g4d3jx_28","style":"F1@1+t","exams":["reference_xray","reference_blood","reference_iv"]},{"hash":"70rwv0_34","text":"보호자와 같이 그림책을 봐요. 궁금한 건 보호자에게 물어봐요.","audio":"tts_70rwv0_34","style":"F1@1+t","exams":["reference_xray","reference_blood","reference_iv"]},{"hash":"1dajubm_33","text":"좋아하는 장난감이나 책을 가지고 기다려요. 마음이 편해져요.","audio":"tts_1dajubm_33","style":"F1@1+t","exams":["reference_xra  function kindDots(p,doneCount){

 function kindState(p,state){
  practiceState=state;practiceDone=state==='success';
  const lay=root.querySelector('.kind-layout');if(!lay)return;
  lay.dataset.practiceState=state;
  const t=document.getElementById('storyTitle');if(t)t.textContent=kindCopy(p,state);
  // 종류마다 있는 버튼이 다름 (순서 고르기는 시작·멈추기가 없음)
  const show=(name,on)=>{const b=lay.querySelector('[data-kind-act="'+name+'"]');if(b)b.hidden=!on;};
  show('start',state==='ready');show('stop',state==='running');show('again',state==='success');
  // 해낸 바로 뒤 같은 자리를 한 번 더 눌러도 “다시”가 눌리지 않게 (아이는 확인하려고 두 번 누름)
  if(state==='success'){const again=lay.querySelector('[data-kind-act="again"]');if(again){again.disabled=true;setTimeout(()=>{again.disabled=false;},KIND_STOP_LOCK_MS);}}
  const nextBtn=document.getElementById('pNext');if(nextBtn)nextBtn.disabled=state==='running'||(state==='ready'&&!!p.interaction.required);
  if(kindOf(p)==='sequence'){seqDragEnd();if(state==='ready')seqPicked=0;seqDraw(p);return;}
  if(kindOf(p)==='tapArea'){tapDraw(p,state);return;}
  if(kindOf(p)==='placePads'){padDragEnd();if(state==='ready')padPlaced=[];padDraw(p);return;}
  if(kindOf(p)==='hold'){if(state!=='running')holdRun=null;if(state==='ready')holdDone=false;holdDraw(p,0);return;}
  if(kindOf(p)==='lookAway'){if(state!=='running')lookRun=null;lookDraw(p,state==='success'?1:0);return;}

  if(kindOf(p)==='breathHold'){
   const box=lay.querySelector('.kind-breathhold');
   if(box&&state!=='running'){box.dataset.phase=state==='success'?'done':'idle';box.querySelector('.kind-word').textContent=state==='success'?'잘했어요':'숨 참기';bhMark(state==='success'?'success':'');}
   return;
  }
  const ball=lay.querySelector('.kind-breathe');
  if(ball&&state!=='running'){ball.dataset.phase=state==='success'?'done':'idle';ball.querySelector('.kind-word').textContent=state==='success'?'잘했어요':'숨 쉬기';}
  if(state==='ready')kindDots(p,0);
 }
 /** 한 번 = 들이마시기(3초) → 내쉬기(4초). count 번 하면 끝 */
 function kindBreath(p,myRun,round,phase){
  if(myRun!==practiceRun||pages[pi]!==p)return;
  const ball=root.querySelector('.kind-breathe');if(!ball)return;
  const word=phase==='in'?'들이마셔요':'내쉬어요';
  ball.dataset.phase=phase;ball.querySelector('.kind-word').textContent=word;
  if(sound)speak(word,p.voice);
  setTimeout(()=>{
   if(myRun!==practiceRun||pages[pi]!==p)return;
   if(phase==='in'){kindBreath(p,myRun,round,'out');return;}
   kindDots(p,round+1);
   if(round+1<kindCount(p)){kindBreath(p,myRun,round+1,'in');return;}
   kindState(p,'success');playPracticeSuccessChime();
   // 칭찬 소리가 끝난 뒤 완료 문구를 읽음
   if(sound&&site.story.autoRead)setTimeout(()=>{if(myRun===practiceRun&&practiceState==='success'&&pages[pi]===p)speak(kindCopy(p,'success'),p.voice);},700);
  },phase==='in'?KIND_IN_MS:KIND_OUT_MS);

 function kindStart(p){

  // 시작 바로 뒤 같은 자리의 멈추기가 눌리지 않게 (빠르게 두 번 누름)

 /* ---- 순서 고르기 (sequence): 섞인 카드를 맞는 순서대로 눌러 위 빈칸에 넣음 ----
    오류 없는 학습: 차례가 아닌 카드는 들어가지 않고 제자리, 실패 소리 없이 "다음은 ○○예요"만 */
 let seqPicked=0; // 칸에 들어간 개수 = 다음에 넣을 카드 번호
 function seqItems(p){const list=kindSet(p).items;return Array.isArray(list)&&list.length>=2?list.map(String):['첫 번째','두 번째'];}
 /** 카드 이름 "주사 바늘 넣기 (따끔)" → 문장 안에서는 괄호를 뺌, 읽을 때는 쉼표로 */
 function seqPlain(label){return label.replace(/\s*\(.*\)\s*$/,'');}
 function seqSpoken(label){return label.replace(/\s*\((.+)\)\s*$/,', $1');}
 /** 마지막 글자에 받침이 있나 (한글이 아니면 없음으로). 순서 고르기·부위 고르기가 같이 씀 */
 function hasBatchim(word){const code=word.charCodeAt(word.length-1)-0xAC00;return code>=0&&code<11172&&code%28!==0;}
 /** 받침이 있으면 "이에요", 없으면 "예요" */
 function seqJosa(word){return hasBatchim(word)?'이에요':'예요';}
 function seqHint(p){const items=seqItems(p),label=seqPlain(items[Math.min(seqPicked,items.length-1)]);return (seqPicked===0?'처음은 ':'다음은 ')+label+seqJosa(label)+'.';}
 /** 늘 같은 모양으로 섞기 (열 때마다 바뀌지 않게). 우연히 맞는 순서가 되면 뒤집음 */
 function seqOrder(items){
  const hash=s=>[...s].reduce((h,ch)=>(h*31+ch.charCodeAt(0))%9973,7);
  const order=items.map((_,i)=>i).sort((a,b)=>hash(items[a])-hash(items[b]));
  return order.every((v,i)=>v===i)?order.reverse():order;
 }
 /** 카드의 감각 그림 (편집기에서 고름, 끄면 없음) */
 const SENSE_SVG={
  cold:'<path d="M12 2v20M3.3 7l17.4 10M20.7 7L3.3 17" stroke="#3d8fdc" stroke-width="2" stroke-linecap="round"/>',

  sting:'<path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z" fill="#f2b705" stroke="#c28a00" stroke-width="1.5" stroke-linejoin="round"/>',

  sound:'<path d="M4 10h3l5-4v12l-5-4H4z" fill="#7a5af5"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="#7a5af5" stroke-width="2" stroke-linecap="round"/>',
  light:'<circle cx="12" cy="12" r="4" fill="#f2b705"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#f2b705" stroke-width="2" stroke-linecap="round"/>',
  smell:'<path d="M7 20c-2-3 2-5 0-8s2-5 0-8M12 20c-2-3 2-5 0-8s2-5 0-8M17 20c-2-3 2-5 0-8s2-5 0-8" fill="none" stroke="#5b8c3a" stroke-width="2" stroke-linecap="round"/>',
  wait:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="#3d8fdc" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="#3d8fdc" stroke-width="2" stroke-linecap="round"/>'
 };
 function seqIcon(p,label){const set=kindSet(p),k=set.showIcons&&set.icons?set.icons[label]:'';return SENSE_SVG[k]?'<svg class="kind-sense" viewBox="0 0 24 24" aria-hidden="true">'+SENSE_SVG[k]+'</svg>':'';}
 function seqBody(p){
  const items=seqItems(p);
  let slots='',cards='';
  items.forEach((label,i)=>{slots+='<li class="kind-slot" data-slot="'+i+'"><span class="kind-num">'+(i+1)+'</span><span class="kind-slot-icon" aria-hidden="true"></span><span class="kind-slot-label"></span></li>';});
  seqOrder(items).forEach(i=>{cards+='<button type="button" class="kind-seq-card" data-kind-card="'+i+'">'+seqIcon(p,items[i])+E(items[i])+'</button>';});
  return '<ol class="kind-slots" aria-label="고른 순서">'+slots+'</ol>'
   +'<div class="kind-seq-cards">'+cards+'</div>'
   +'<div class="kind-actions"><button class="p-button" type="button" data-kind-act="again" hidden>다시 해 보기</button></div>';
 }
 /** 칸·카드를 지금 seqPicked 에 맞춰 그림 */
 function seqDraw(p){
  const items=seqItems(p),lay=root.querySelector('.kind-layout');if(!lay)return;
  lay.querySelectorAll('.kind-slot').forEach((li,i)=>{
   li.dataset.filled=i<seqPicked;li.dataset.next=i===seqPicked;
   li.querySelector('.kind-slot-label').textContent=i<seqPicked?items[i]:'';
   const icon=li.querySelector('.kind-slot-icon');if(icon)icon.innerHTML=i<seqPicked?seqIcon(p,items[i]):'';
   li.setAttribute('aria-label',(i+1)+'번 '+(i<seqPicked?items[i]:'빈칸'));
  });
  lay.querySelectorAll('[data-kind-card]').forEach(b=>{const i=Number(b.dataset.kindCard);b.disabled=i<seqPicked;b.dataset.next=i===seqPicked;});
  // 다 넣으면 카드는 안 보이게만 (자리는 그대로 → 아래 “다시 해 보기”가 손가락 밑으로 올라오지 않게)
  const box=lay.querySelector('.kind-seq-cards');if(box)box.style.visibility=seqPicked>=items.length?'hidden':'';
 }
 function seqChoose(p,i){
  const items=seqItems(p);if(seqPicked>=items.length||i<seqPicked)return;
  clearTimeout(autoTimeout);autoTimeout=null; // 들어올 때 읽을 ① 이 누른 뒤에 나오지 않게
  const t=document.getElementById('storyTitle');
  if(i!==seqPicked){const hint=seqHint(p);if(t)t.textContent=hint;if(sound)speak(hint,p.voice);return;}
  seqPicked++;seqDraw(p);
  if(seqPicked<items.length){
   beep();if(t)t.textContent=kindCopy(p,'ready');
   if(sound)speak(seqSpoken(items[i]),p.voice);
   return;
  }
  // 마지막 카드: 카드 이름은 읽지 않고 (곧 읽을 ③ 이 끊지 않게) 칭찬 소리 → ③
  kindState(p,'success');playPracticeSuccessChime();
  const myRun=practiceRun;
  if(sound&&site.story.autoRead)setTimeout(()=>{if(myRun===practiceRun&&practiceState==='success'&&pages[pi]===p)speak(kindCopy(p,'success'),p.voice);},700);
 }

 /* 끌어다 놓기: 카드를 8px 넘게 움직이면 끌기, 덜 움직이고 떼면 그냥 누름
    맞는 카드는 칸 목록 위(둘레 24px까지)에 놓으면 다음 빈칸에 들어감. 차례가 아닌 카드는 어디에 놓든 "다음은 ○○예요"
    누름도 손을 뗄 때(pointerup) 바로 처리: 손가락으로 끈 바로 다음 톡에는 click 이 안 오는 경우가 있음 (Edge 터치 시험에서 확인)
    → 뒤따르는 click 은 무시. 키보드·화면 낭독기는 pointer 없이 click 만 오므로 아래 click 처리기가 맡음 */
 const SEQ_DRAG_PX=8,SEQ_DROP_MARGIN=24,SEQ_SKIP_CLICK_MS=350;
 const SEQ_MISS='위의 빈칸에 놓아 봐요. 카드를 눌러도 들어가요.';
 let seqPress=null;      // 누르고 있는 카드 {i, x, y, moved, card, ghost}
 let seqSkipClick=false; // 손을 뗀 바로 뒤에 따라오는 click 은 무시 (두 번 세지 않게)
 function seqOverSlots(x,y){
  const box=root.querySelector('.kind-slots');if(!box)return false;
  const r=box.getBoundingClientRect();
  return x>=r.left-SEQ_DROP_MARGIN&&x<=r.right+SEQ_DROP_MARGIN&&y>=r.top-SEQ_DROP_MARGIN&&y<=r.bottom+SEQ_DROP_MARGIN;
 }
 function seqDragEnd(){
  if(seqPress){if(seqPress.ghost)seqPress.ghost.remove();seqPress.card.dataset.lifted='false';}
  seqPress=null;
 }
 /** 맞는 카드를 칸 밖에 놓음 → 어디에 놓는지 알려 줌 */
 function seqMissed(p){
  const t=document.getElementById('storyTitle');if(t)t.textContent=SEQ_MISS;
  if(sound)speak(SEQ_MISS,p.voice);
 }
 document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('[data-kind-card]');
  if(!card||card.disabled||e.button!==0||kindOf(pages[pi])!=='sequence')return;
  seqDragEnd();
  try{card.setPointerCapture(e.pointerId);}catch{} // 캡처가 막혀도 끌기는 됨
  seqPress={i:Number(card.dataset.kindCard),x:e.clientX,y:e.clientY,moved:false,card,ghost:null};
 });
 document.addEventListener('pointermove',e=>{
  const p=seqPress;if(!p)return;
  if(!p.moved&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<SEQ_DRAG_PX)return;
  if(!p.moved){
   p.moved=true;
   const g=document.createElement('div');
   g.className='kind-seq-drag';g.setAttribute('aria-hidden','true');g.innerHTML=p.card.innerHTML;
   g.style.width=p.card.offsetWidth+'px';g.style.fontSize=getComputedStyle(p.card).fontSize;
   document.body.append(g);p.ghost=g;p.card.dataset.lifted='true';
  }
  p.ghost.style.left=e.clientX+'px';p.ghost.style.top=e.clientY+'px';
 });
 document.addEventListener('pointerup',e=>{
  const p=seqPress;if(!p)return;
  seqDragEnd();
  seqSkipClick=true;setTimeout(()=>{seqSkipClick=false;},SEQ_SKIP_CLICK_MS);
  const page=pages[pi];if(kindOf(page)!=='sequence')return;
  // 그냥 누름 · 차례가 아닌 카드 · 칸 위에 놓은 맞는 카드 → 고르기. 칸 밖에 놓은 맞는 카드 → 안내
  if(!p.moved||p.i!==seqPicked||seqOverSlots(e.clientX,e.clientY))seqChoose(page,p.i);
  else seqMissed(page);
 });
 document.addEventListener('pointercancel',seqDragEnd);

 /* ---- 부위 고르기 (tapArea): 몸 그림에서 검사할 곳을 누름 → 젤 방울 + 느낌 (React TapAreaPractice 를 옮김) ----
    오류 없는 학습: 다른 곳을 눌러도 실패 소리 없이 "여기는 ○○예요. △△를 눌러 봐요." + 맞는 곳이 노랗게 빛남 */
 const BODY_NAMES=cfg.bodyParts||{}; // 부위 이름은 편집기 BODY_PARTS 에서 받음
 /** 부위의 가운데 (젤 방울을 그릴 자리, 그림 좌표 200×300) */
 //   턱·허리 양쪽·서는 곳(발 밑 발판)은 11-06 엑스레이 스토리보드 (서기·양손 허리·턱 연습)
 const BODY_CENTER={head:{x:100,y:44},chest:{x:100,y:112},belly:{x:100,y:166},arm:{x:40,y:150},leg:{x:100,y:240},chin:{x:100,y:74},'waist-left':{x:58,y:158},'waist-right':{x:142,y:158},stand:{x:100,y:312}};

 /** 맞으면 보이는 표시 (누를 수 없게 — 다시 누르면 아래 부위가 받음). kind: gel 젤 방울(초음파) / check 체크.

 function tapMark(part,kind){

    연습 그림(tapFigure)과 13단계 자세 다시 보기(ourPoseFig)가 같이 씀 */
 const XR_PLATE='<rect x="50" y="84" width="100" height="94" rx="7" fill="#e6ecf2" fill-opacity="0.6" stroke="#8a9bb0" stroke-width="2"/>'
  +'<path d="M62 97h10M62 97v10M138 97h-10M138 97v10M62 165h10M62 165v-10M138 165h-10M138 165v-10" stroke="#6f839b" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
  +'<rect x="44" y="114" width="6" height="30" rx="3" fill="#b7c3cf"/><rect x="150" y="114" width="6" height="30" rx="3" fill="#b7c3cf"/>';
 function tapFigure(p){

 function tapBody(p){

  return '<div class="kind-figure">'+tapFigure(p)+'</div>'
   +feelBox(kindSet(p).feel)

 /** 상태에 맞춰 그림을 고침: ready = 처음 모양 / success = 젤 방울 + 느낌 상자 */
 function tapDraw(p,state){
  const lay=root.querySelector('.kind-layout');if(!lay)return;
  lay.querySelectorAll('[data-kind-part]').forEach(g=>{g.removeAttribute('filter');g.classList.remove('kind-hint');});
  if(state==='ready')tapHit=[];
  // 표시: 다 하면 전부, 묶음 부위는 누른 곳만
  lay.querySelectorAll('[data-kind-mark]').forEach(m=>{m.style.display=state==='success'||tapHit.includes(m.dataset.kindMark)?'':'none';});
  // 양손 허리: 손을 올린 쪽은 늘어진 팔과 점선 자리를 숨김 (손이 네 개로 보이지 않게)
  const parts=tapParts(p),placed=n=>parts.includes(n)&&(state==='success'||tapHit.includes(n));
  lay.querySelectorAll('[data-kind-arm]').forEach(a=>{a.style.display=placed('waist-'+a.dataset.kindArm)?'none':'';});
  lay.querySelectorAll('.kind-zone').forEach(z=>{const s=z.querySelector('.kind-hand-spot');if(s)s.style.display=placed(z.dataset.kindPart)?'none':'';});
  const feel=lay.querySelector('.kind-feel');if(feel)feel.hidden=state!=='success'||!feel.textContent;
 }
 function tapChoose(p,part){
  const parts=tapParts(p);
  // 다 한 뒤: 맞는 곳을 또 누르면 느낌만 다시 읽음, 다른 곳은 그대로 둠
  if(practiceState==='success'){if(parts.includes(part)&&sound&&kindSet(p).feel)speak(kindSet(p).feel,p.voice);return;}
  clearTimeout(autoTimeout);autoTimeout=null; // 들어올 때 읽을 ① 이 누른 뒤에 나오지 않게
  const t=document.getElementById('storyTitle');
  if(!parts.includes(part)){
   const hint=tapHint(p,part);if(t)t.textContent=hint;
   // 맞는 곳(아직 안 누른 곳)이 노랗게 빛남. 안 보이는 누르는 칸(턱·허리)은 노란 동그라미로
   for(const n of parts)if(!tapHit.includes(n)){const g=root.querySelector('[data-kind-part="'+n+'"]');if(g){g.setAttribute('filter','url(#kind-glow)');g.classList.add('kind-hint');}}
   if(sound)speak(hint,p.voice);
   return;
  }
  if(!tapHit.includes(part))tapHit.push(part);
  if(tapHit.length<parts.length){

 const NAME_DELAY_MS=1100;     // “딩동” 뒤 부르기까지

  if(!sound||!site.practice.effects)return;

   [659.25,523.25].forEach((f,i)=>{const t=audioCtx.currentTime+.02+i*.38,o=audioCtx.createOscillator(),g=audioCtx.createGain();practiceSoundNodes.push({o,g});o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.65);});

   if(candidates.length<4){for(const x of stepPages){if(used.has(x.i))continue;candidates.push(x);used.add(x.i);if(candidates.length===4)break;}}

    → 그래도 넘치면 글·버튼을 제자리(왼쪽)로 (고치기 전과 같음). 연습 상태마다 바뀌지 않게 결과 글·버튼이 다 보인 상태로 한 번 재서 정함 */
 const OUR_SIDE_LV=['','is-tight','is-chips','is-off'];
 // 옮기기 전 오른쪽 칸 높이·페이지 높이(lay.ourBase)보다 커지지 않고, 아래 [이전]·[다음] 줄 위에서 끝나야 들어간 것
 function ourSideFits(card,kc){
  const lay=card.closest('.kind-layout'),b=lay&&lay.ourBase;if(!b)return false;
  const nav=document.querySelector('#story .story-nav'),nt=nav?nav.getBoundingClientRect().top:innerHeight,r=card.getBoundingClientRect();
  return r.height<=b.h+1&&r.bottom<=nt-4&&kc.getBoundingClientRect().bottom<=Math.max(innerHeight,b.kcb)+1&&document.scrollingElement.scrollHeight<=Math.max(innerHeight,b.scroll)+1;
 }
 /** 결과 글·버튼이 다 보이고 제목이 연습 전·해낸 뒤 글일 때 모두 들어가는지 (재는 동안 제목 읽어 주기 aria-live 는 잠깐 끔) */
 function ourSideFitsAll(card,kc){
  const feel=card.querySelector(':scope>.kind-feel'),acts=card.querySelector(':scope>.kind-actions'),undo=[];
  if(feel&&feel.hidden&&feel.textContent.trim()){feel.hidden=false;undo.push(()=>{feel.hidden=true;});}
  if(acts&&![...acts.children].some(b=>!b.hidden)){const b=acts.querySelector('[data-kind-act="again"]')||acts.firstElementChild;if(b&&b.hidden){b.hidden=false;undo.push(()=>{b.hidden=true;});}}
  const t=card.querySelector('#storyTitle'),p=pages[pi];
  const texts=t&&p?[...new Set(['ready','success'].map(s=>{try{return kindCopy(p,s);}catch(e){return '';}}).filter(Boolean))]:[];
  if(texts.length){const html=t.innerHTML,live=t.getAttribute('aria-live');t.removeAttribute('aria-live');undo.push(()=>{t.innerHTML=html;if(live!==null)t.setAttribute('aria-live',live);});}
  try{return texts.length?texts.every(x=>{t.textContent=x;return ourSideFits(card,kc);}):ourSideFits(card,kc);}finally{undo.reverse().forEach(f=>f());}
 }
 function ourSideLevel(lay,card,lv){
  lay.dataset.ourSideLv=lv;
  const m=card.querySelector(':scope>.our-side-missions');if(m){m.classList.remove(...OUR_SIDE_LV.filter(Boolean));if(lv)m.classList.add(lv);}
  return m;
 }

  lay.classList.remove('our-side');delete lay.dataset.ourSideLv;
  card.querySelector(':scope>.our-side-missions')?.remove();
  for(const el of [...card.querySelectorAll(':scope>.kind-feel,:scope>.kind-actions')].reverse()){const n=el.ourHome;kc.insertBefore(el,n&&n.parentNode===kc?n:null);}
 }
 let ourSideRO=null;
 function ourSide(){
  ourSideRO?.disconnect();ourSideRO=null;
  const lay=document.querySelector('#story .kind-layout');if(!lay)return;
  const card=lay.querySelector(':scope>.instruction-grid>.instruction-card'),kc=lay.querySelector(':scope>.kind-card');if(!card||!kc)return;
  ourSideHome(lay,card,kc); // 창 크기를 바꿔 다시 잴 때도 처음 모양에서
  if(!(OUR_SIDE_MQ&&OUR_SIDE_MQ.matches))return;
  lay.ourBase={h:card.getBoundingClientRect().height,kcb:kc.getBoundingClientRect().bottom,scroll:document.scrollingElement.scrollHeight};
  lay.classList.add('our-side');
  for(const el of [...kc.querySelectorAll(':scope>.kind-feel,:scope>.kind-actions')]){el.ourHome=el.nextElementSibling;card.append(el);}
  lay.dataset.ourSideLv='';ourSideMissions();
  let ok=false;
  for(const lv of OUR_SIDE_LV){const m=ourSideLevel(lay,card,lv);if(ourSideFitsAll(card,kc)){ok=true;break;}if(!m)break;}
  if(!ok){ourSideHome(lay,card,kc);return;}
  // 그래도 연습하는 동안 넘치면 (다른 곳을 누른 안내 글 등) 한 단계씩 줄이기만 함 — 그린 뒤 칠하기 전이라 깜빡이지 않음
  if(window.ResizeObserver){
   ourSideRO=new ResizeObserver(()=>{
    if(!card.isConnected||!lay.classList.contains('our-side')||ourSideFits(card,kc))return;
    const i=OUR_SIDE_LV.indexOf(lay.dataset.ourSideLv||'');
    if(card.querySelector(':scope>.our-side-missions')&&i<OUR_SIDE_LV.length-1)ourSideLevel(lay,card,OUR_SIDE_LV[i+1]);else{ourSideRO?.disconnect();ourSideHome(lay,card,kc);}
   });
   ourSideRO.observe(card);ourSideRO.observe(kc);
  }
 }

 let ourPress=null;
 function ourHint(btn,text){
  document.querySelector('.our-hint')?.remove();

  document.body.append(tip);
  const r=btn.getBoundingClientRect();
  tip.style.top=Math.round(r.bottom+8)+'px';

  try{b.setPointerCapture(e.pointerId);}catch(err){}

 function ourGuideInfo(){
  const x=pi>=0&&c()?c():null,items=[];

  const dateRow=id=>{const d=visitPlans[id],left=ourDayLeft(d);if(left===null||left<0)return '';const wk='일월화수목금토'[new Date(Number(d.year),Number(d.month)-1,Number(d.day)).getDay()];return Number(d.month)+'월 '+Number(d.day)+'일 ('+wk+') · '+ourDdayText(left);};
  if(x){const r=dateRow(x.id);items.push(['검사 일정','<p>'+(r?E(x.exam)+': '+E(r):'아직 날짜를 넣지 않았어요. 몰라도 괜찮아요.')+'</p>'+(pages.some(q=>q.node==='schedule')?'<button type="button" class="our-chip" data-our="sched-go">날짜 고르기</button>':'')]);}
  else{const rows=(contents||[]).map(y=>{const r=dateRow(y.id);return r?'<li>'+E(y.exam)+': '+E(r)+'</li>':'';}).join('');items.push(['검사 일정',rows?'<ul>'+rows+'</ul>':'<p>검사를 고르면 날짜를 넣을 수 있어요.</p>']);}
  if(x){
   // 준비사항: 준비 단계(scenarioRole …-prepare 또는 제목에 "준비")의 글
   const prep=pages.filter(q=>q.node==='process'&&(/-prepare$/.test(q.scenarioRole||'')||/준비/.test(q.title||''))&&q.body).map(q=>'<li>'+nl(q.body)+'</li>').join('');
   items.push(['준비사항',prep?'<ul>'+prep+'</ul>':'<p>검사 안내 단계에서 확인해 주세요.</p>']);
   // 어려워할 수 있는 감각: 연습 느낌 + 미리 알아두어요 글에서 감각 문장 (같은 문장은 한 번)
   const seen=new Set(),sense=[];
   for(const q of pages){
    const txt=[kindOf(q)?kindSet(q).feel:'',canOpenGuide(q)?q.guideText:''].join('\n');
    /* 문장마다 나눔 (뒤를 보는 정규식은 옛 iPad 사파리가 못 읽어 안 씀) */for(const line of txt.replace(/([.!?])\s+/g,'$1\n').split('\n')){const t=line.trim();if(t&&FEEL_ICONS.some(f=>f[0].test(t))&&!seen.has(t)){seen.add(t);sense.push(t);}}
   }
   items.push(['어려워할 수 있는 감각',sense.length?'<ul>'+sense.slice(0,6).map(t=>'<li>'+E(t)+'</li>').join('')+'</ul>':'<p>검사 안내의 "미리 알아두어요"에서 확인해 주세요.</p>']);

 const ourHelpIcon=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
 function ourHelpOpen(){
  stop();

   +'<div class="our-help-say" hidden></div>'

 /** 카드를 고름: 위에 크게 + 읽기 (누른 반응이라 자동 읽기를 꺼도 읽음, 소리를 끄면 글만) */
 function ourHelpPick(id){
  const x=OUR_HELP_CARDS.find(x=>x[0]===id),box=document.querySelector('.our-rest .our-help-say');if(!x||!box)return;
  document.querySelectorAll('.our-rest .our-help-card').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ourHelp===id?'true':'false'));
  clearTimeout(ourRestTimer);
  box.hidden=false;
  box.innerHTML='<p class="our-help-big" role="status">'+E(x[1])+'</p>'
   +(id==='rest'?'<div class="our-ball" data-phase="in"><span>들이마셔요</span></div><p class="our-note">풍선을 보면서 천천히 숨을 쉬어 봐요.</p>':'')
   +'<button type="button" class="our-help-again" data-our-help="'+id+'">'+icon('sound')+'다시 듣기</button>';
  const ball=box.querySelector('.our-ball');
  const step=phase=>{
   if(!ball||!ball.isConnected)return;
   ball.dataset.phase=phase;ball.querySelector('span').textContent=phase==='in'?'들이마셔요':'내쉬어요';
   ourRestTimer=setTimeout(()=>step(phase==='in'?'out':'in'),phase==='in'?3000:4000);
  };
  if(ball)step('in');
  if(sound)speak(x[1],'',site.story.voiceRate);
 }
 document.addEventListener('click',e=>{
  const h=e.target.closest&&e.target.closest('[data-our-help]');
  if(h){ourHelpPick(h.dataset.ourHelp);return;}
  if(!(e.target.closest&&e.target.closest('[data-our-rest]')))return;
  ourHelpOpen();
 });

 /* ---- 연습 먼저 하기: 연습을 해낼 때까지 [다음 단계] 대신 "먼저 연습해 봐요" (잠긴 버튼은 ourBefore 의 required) ---- */
 let ourNextWatch=null;
 function ourGateLabel(){
  if(ourNextWatch){ourNextWatch.disconnect();ourNextWatch=null;}
  const p=pages[pi],next=document.getElementById('pNext');
  if(!next||!p||!ourGateOn()||!p.interaction||!p.interaction.type||p.interaction.type==='none')return;
  const label=next.textContent;
  // 11-11: 단계 바로 가기를 풀면서 — 이번에 이미 해내고 넘어간 연습(done)에 [이전]·바로 가기로 다시 오면 [다음]은 열어 둠
  //   (해낸 연습을 또 해야 넘어가게 하지 않음. 다시 해 보는 중(running)에는 기획대로)
  const draw=()=>{if(next.disabled&&done[p.id]&&practiceState!=='running'){next.disabled=false;return;}const locked=next.disabled&&practiceState!=='running';next.classList.toggle('our-locked',locked);const want=locked?'먼저 연습해 봐요':label;if(next.textContent!==want)next.textContent=want;};
  draw();
  ourNextWatch=new MutationObserver(draw);ourNextWatch.observe(next,{attributes:true,attributeFilter:['disabled']});
 }

 };
 function ourStickerOf(cid){const x=our.stickers[cid];return x&&typeof x==='object'?{got:Array.isArray(x.got)?x.got.filter(k=>OUR_STICKER[k]):[],count:Number(x.count)||0}:{got:[],count:0};}
 /** 이 검사에 있는 구간 (단계가 있는 것만, 순서대로) */
 function ourPhasesOf(list){const have=new Set(list.map((q,i)=>typeof uxPhaseOf==='function'?uxPhaseOf(q,i,list):'prep'));return OUR_PHASES.map(x=>x[0]).filter(k=>have.has(k));}
 function ourStickerCheck(){
  if(!ourOn('stickers')||pi<0||!c())return;
  const cid=c().id,round=ourRound[cid]||(ourRound[cid]=new Set());
  if(!Object.keys(done).length)round.clear(); // 처음부터 다시 (다시 연습하기)
  const box=ourStickerOf(cid);let fresh=null;
  for(const key of ourPhasesOf(pages)){
   if(round.has(key))continue;
   const mine=pages.filter((q,i)=>ourPhaseOf(q,i)===key);
   if(!mine.length||!mine.every(q=>done[q.id]))continue;
   round.add(key);fresh=key;
   if(!box.got.includes(key))box.got.push(key);
  }
  if(pi>=pages.length&&!round.has('complete')){round.add('complete');box.count++;}
  our.stickers[cid]=box;ourSave();
  if(fresh)ourStickerToast(fresh);
 }
 function ourStickerToast(key){
  document.querySelector('.v14-moment')?.remove(); // 기획의 "여기까지 확인했어요!"와 겹치지 않게
  const html='<div class="our-sticker-big">'+OUR_STICKER[key]+'</div><h2>스티커를 받았어요!</h2><p class="our-text">'+E(ourPhaseName(key))+' 구간을 잘했어요.</p>';
  const layer=ourLayer('our-toast',html,'스티커를 받았어요',false);
  const opened=performance.now();let spoken=!(sound&&site.story.autoRead),timeUp=false;
  const close=()=>{if(!layer.isConnected)return;layer.remove();document.body.classList.remove('our-layer-open');
   // 받는 동안 끊긴 페이지 읽기를 다시
   if(sound&&site.story.autoRead){const again=document.querySelector('#story [data-p="speak"]');if(again)again.click();}};
  playPracticeSuccessChime();
  if(!spoken)setTimeout(()=>{const u=speak('스티커를 받았어요!','',site.story.voiceRate,true);if(u){const end=u.onend;u.onend=ev=>{if(end)end(ev);spoken=true;if(timeUp)close();};}else spoken=true;},250);
  setTimeout(()=>{timeUp=true;if(spoken)close();},1500);
  setTimeout(close,4000);
  layer.addEventListener('click',()=>{if(performance.now()-opened>400)close();});
 }
 function ourStickerRow(cid,list){const box=ourStickerOf(cid);return ourPhasesOf(list).map(k=>'<span class="our-mini'+(box.got.includes(k)?'':' is-empty')+'" title="'+E(ourPhaseName(k))+'">'+OUR_STICKER[k]+'</span>').join('');}
 function ourAllDone(){return (contents||[]).length>0&&(contents||[]).every(x=>ourStickerOf(x.id).count>0);}
 function ourTotal(){return (contents||[]).reduce((n,x)=>n+ourStickerOf(x.id).got.length,0);}
 function ourHomeStickers(){
  if(!ourOn('stickers')||pi!==-2)return;
  const grid=document.querySelector('#home .exam-grid');if(!grid||document.querySelector('.our-shelf'))return;

  else shelf+=total?'<p>모은 스티커 <b>'+total+'</b>개</p>':'<p>끝까지 연습하면 스티커를 받아요</p>';

 // 칭찬 스티커 3종 (그림은 위 스티커 그림을 같이 씀)
 const OUR_PICKS=[['star','별 스티커','prep'],['heart','하트 스티커','before'],['flower','꽃 스티커','after']];

 function ourRoleOf(q){return q&&c()&&q.id===fixedPracticeStep(c())?.id?'@practice':q&&q.scenarioRole;}

 function ourTipInline(){
  const sh=document.getElementById('pSheet');
  if(!sh||sh.dataset.helpKind!=='guide'||sh.classList.contains('our-tip'))return;
  const trigger=document.querySelector('#story .v15-help-trigger');if(!trigger)return;
  // 창이 아니라 단계 글의 일부 → 화면 잠금(스크롤·뒤 화면 막기)을 풂
  if(sheetLock){
   const saved=sheetLock;sheetLock=null;
   if(saved.bodyStyle===null)document.body.removeAttribute('style');else document.body.setAttribute('style',saved.bodyStyle);
   document.documentElement.style.overflow=saved.overflow;root.inert=saved.inert;
   if(saved.hidden===null)root.removeAttribute('aria-hidden');else root.setAttribute('aria-hidden',saved.hidden);
   window.scrollTo(0,saved.y);
  }
  sh.classList.add('our-tip');
  const panel=sh.querySelector('.nurse-panel');if(panel){panel.removeAttribute('aria-modal');panel.setAttribute('role','region');}
  const card=trigger.closest('.instruction-card'),anchor=!card||trigger.parentElement===card?trigger:trigger.parentElement;
  anchor.after(sh);
  const first=sh.querySelector('button');if(first)try{first.focus({preventScroll:true});}catch(e){} // 옮기면 초점이 빠짐
  trigger.setAttribute('aria-expanded','true');
  new MutationObserver((m,o)=>{if(!sh.isConnected){trigger.setAttribute('aria-expanded','false');o.disconnect();}}).observe(sh.parentNode,{childList:true});
  // 펼치기: 높이 0 → 내용 높이 (아래 글·버튼도 같이 부드럽게 밀림), 다 펼치면 auto
  const h=sh.scrollHeight,still=ourTipStill();
  if(!still){
   sh.style.height='0px';sh.style.opacity='0';void sh.offsetHeight;
   sh.style.height=h+'px';sh.style.opacity='1';
   setTimeout(()=>{if(!sh.dataset.closing){sh.style.height='';sh.style.opacity='';}},OUR_TIP_MS+40);
  }
  // 펼치는 동안 화면도 같이 내려가서 문구가 아래 [이전]·[다음] 막대에 가리지 않고 다 보이게.
  // 높이가 아직 0일 때 한 번에 내리면 문서가 짧아서 덜 내려감 → 펼침과 같은 속도로 매 장면 따라 내림
  const want=()=>{
   const r=sh.getBoundingClientRect(),nav=document.querySelector('#story .story-nav'),bar=document.querySelector('#story .story-bar');
   const bottom=nav?nav.getBoundingClientRect().top-12:innerHeight-12,top=(bar?bar.getBoundingClientRect().bottom:0)+12;
   return Math.min(r.top+(sh.dataset.closing?0:h)-bottom,r.top-top); // 다 보이게, 단 말풍선 윗부분이 위 막대 밑으로 숨지는 않게
  };
  const up=want();
  if(up>0){
   const y0=window.scrollY,t0=performance.now();
   if(still)window.scrollTo(0,y0+up);
   else{
    const step=now=>{if(sh.dataset.closing)return;const k=Math.min(1,(now-t0)/OUR_TIP_MS),e=1-Math.pow(1-k,3);window.scrollTo(0,y0+up*e);if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
    setTimeout(()=>{if(!sh.dataset.closing&&sh.isConnected){const more=want();if(more>1)window.scrollBy({top:more,behavior:'smooth'});}},OUR_TIP_MS+60); // 끝에서 덜 내려간 만큼
   }
  }
 }
